# Full experiment plan for the LKYWDetection / LA-YOLO26 paper.
# Three groups: G1 ablation, G2 SOTA comparison, G3 generalization.
# Run subsets with:
#   python tools/lkyw_run.py --plan lkyw_experiments/plans/paper_full.yaml --group g1

workspace: "{repo}"
weights_dir: "{workspace}/weights"
project: "{workspace}/runs/lkyw"

data:
  lkyw: "{repo}/lkyw_experiments/datasets/lkyw.yaml"
  lkyw_noai: "{repo}/lkyw_experiments/datasets/lkyw_noai.yaml"
  carcrash: "{repo}/lkyw_experiments/datasets/carcrash.yaml"

seeds: [0, 1, 42, 3407, 205]

train_defaults:
  epochs: 300
  patience: 50
  imgsz: 640
  batch: 16
  device: 0
  workers: 8
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  cos_lr: True
  warmup_epochs: 5.0
  close_mosaic: 10
  box: 9.0
  cls: 0.5
  dfl: 2.0
  fl_gamma: 0.0
  fl_alpha: 0.25
  fire_prior: 0.0
  fire_class_ids: ""
  nofire_class_ids: ""
  cls_pw: 0.0
  plots: True
  deterministic: True

physical_aug:
  scale: 0.9
  perspective: 0.001
  shear: 0.1
  mosaic: 1.0
  mixup: 0.15

no_physical_aug:
  scale: 0.5
  perspective: 0.0
  shear: 0.0
  mosaic: 1.0
  mixup: 0.0

full_loss:
  fl_gamma: 1.5
  fl_alpha: 0.25
  fire_prior: 0.20
  fire_class_ids: "0,2"
  nofire_class_ids: "1,3"

experiments:
  # ============================================================
  # Group 1: Ablation — prove each module's contribution step by step.
  # Chain: base → +aug → +ProgLoss → +STAL → +SFGA → MuSGD(drop).
  # ============================================================

  - name: g1_yolo26m_base
    groups: [g1, ablation, step1]
    model: "{weights_dir}/yolo26m.pt"
    data: lkyw
    params:
      optimizer: SGD
      stal: False
      prog_loss: False
      inherit: [no_physical_aug]

  - name: g1_yolo26m_aug
    groups: [g1, ablation, step2]
    model: "{weights_dir}/yolo26m.pt"
    data: lkyw
    params:
      optimizer: SGD
      stal: False
      prog_loss: False
      inherit: [physical_aug]

  - name: g1_yolo26m_aug_prog
    groups: [g1, ablation, step3]
    model: "{weights_dir}/yolo26m.pt"
    data: lkyw
    params:
      optimizer: SGD
      stal: False
      prog_loss: True
      inherit: [physical_aug]

  - name: g1_yolo26m_aug_prog_stal
    groups: [g1, ablation, step4]
    model: "{weights_dir}/yolo26m.pt"
    data: lkyw
    params:
      optimizer: SGD
      stal: True
      prog_loss: True
      inherit: [physical_aug]

  - name: g1_la_yolo26m_sfga
    groups: [g1, ablation, step5]
    model: "{repo}/ultralytics/cfg/models/26/la-yolo26m.yaml"
    pretrained: "{weights_dir}/yolo26m.pt"
    data: lkyw
    params:
      optimizer: SGD
      stal: True
      prog_loss: True
      inherit: [physical_aug]

  - name: g1_la_yolo26m_fireprior
    groups: [g1, ablation, step6]
    model: "{repo}/ultralytics/cfg/models/26/la-yolo26m.yaml"
    pretrained: "{weights_dir}/yolo26m.pt"
    data: lkyw
    params:
      optimizer: SGD
      stal: True
      prog_loss: True
      fire_prior: 0.20
      fire_class_ids: "0,2"
      nofire_class_ids: "1,3"
      inherit: [physical_aug]

  - name: g1_la_yolo26m_musgd
    groups: [g1, ablation, step7]
    model: "{repo}/ultralytics/cfg/models/26/la-yolo26m.yaml"
    pretrained: "{weights_dir}/yolo26m.pt"
    data: lkyw
    params:
      optimizer: MuSGD
      stal: True
      prog_loss: True
      fire_prior: 0.20
      fire_class_ids: "0,2"
      nofire_class_ids: "1,3"
      inherit: [physical_aug]

  # ============================================================
  # Group 2: SOTA comparison — YOLO11m vs YOLO26m vs LA-YOLO26m.
  # ============================================================

  - name: g2_yolo11m
    groups: [g2, sota]
    model: "{weights_dir}/yolo11m.pt"
    data: lkyw
    params:
      optimizer: SGD
      stal: False
      prog_loss: False
      inherit: [physical_aug]

  - name: g2_yolo26m
    groups: [g2, sota]
    model: "{weights_dir}/yolo26m.pt"
    data: lkyw
    params:
      optimizer: MuSGD
      stal: True
      prog_loss: True
      inherit: [physical_aug]

  - name: g2_la_yolo26m
    groups: [g2, sota]
    model: "{repo}/ultralytics/cfg/models/26/la-yolo26m.yaml"
    pretrained: "{weights_dir}/yolo26m.pt"
    data: lkyw
    params:
      optimizer: SGD
      stal: True
      prog_loss: True
      fire_prior: 0.20
      fire_class_ids: "0,2"
      nofire_class_ids: "1,3"
      inherit: [physical_aug]

  # ============================================================
  # Group 3: Generalization — transfer to CarCrash.
  # ============================================================

  - name: g3_yolo11m_carcrash
    groups: [g3, generalization]
    model: "{weights_dir}/yolo11m.pt"
    data: carcrash
    params:
      optimizer: SGD
      stal: False
      prog_loss: False
      inherit: [physical_aug]

  - name: g3_yolo26m_carcrash
    groups: [g3, generalization]
    model: "{weights_dir}/yolo26m.pt"
    data: carcrash
    params:
      optimizer: MuSGD
      stal: True
      prog_loss: True
      fl_gamma: 1.5
      fl_alpha: 0.25
      inherit: [physical_aug]

  - name: g3_la_yolo26m_carcrash
    groups: [g3, generalization]
    model: "{repo}/ultralytics/cfg/models/26/la-yolo26m.yaml"
    pretrained: "{weights_dir}/yolo26m.pt"
    data: carcrash
    params:
      optimizer: SGD
      stal: True
      prog_loss: True
      inherit: [physical_aug, full_loss]
