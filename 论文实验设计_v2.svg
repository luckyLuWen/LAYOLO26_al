<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720">

<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#607D8B" />
  </marker>
</defs>

<rect width="920" height="720" fill="#FAFAFA" rx="4"/>
<text x="460" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">审稿意见 → 实验设计方案回复</text>
<rect x="30" y="70" width="390" height="110" rx="8" fill="#FFEBEE" stroke="#E53935" stroke-width="2"/>
<rect x="40" y="78" width="80" height="24" rx="6" fill="#E53935"/>
<text x="80" y="95" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFF" font-weight="bold">审稿意见 ①</text>
<text x="50" y="125" font-family="Arial" font-size="13" fill="#333"><tspan x="50" dy="0" font-weight="bold">消融实验不足</tspan>，不知道<tspan x="50" dy="22">性能提升具体来自哪个模块，</tspan><tspan x="50" dy="22">无法证明各组件独立贡献</tspan></text>
<line x1="430" y1="125" x2="480" y2="125" stroke="#607D8B" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="490" y="70" width="400" height="110" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
<rect x="500" y="78" width="80" height="24" rx="6" fill="#4CAF50"/>
<text x="540" y="95" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFF" font-weight="bold">解决方案 ①</text>
<text x="510" y="125" font-family="Arial" font-size="12" fill="#333"><tspan x="510" dy="0" font-weight="bold">构建阶段式消融实验</tspan>，逐步叠加模块：<tspan x="510" dy="22">Base → +物理增强 → +ProgLoss</tspan><tspan x="510" dy="22">→ +STAL → +SFGA → </tspan><tspan font-weight="bold">LA-YOLO26</tspan></text>
<rect x="30" y="205" width="390" height="100" rx="8" fill="#FFEBEE" stroke="#E53935" stroke-width="2"/>
<rect x="40" y="213" width="80" height="24" rx="6" fill="#E53935"/>
<text x="80" y="230" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFF" font-weight="bold">审稿意见 ②</text>
<text x="50" y="255" font-family="Arial" font-size="13" fill="#333"><tspan x="50" dy="0" font-weight="bold">方法创新性不足</tspan>，论文缺少<tspan x="50" dy="22">新模块/新理论的充分论证</tspan></text>
<line x1="430" y1="255" x2="480" y2="255" stroke="#607D8B" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="490" y="205" width="400" height="100" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
<rect x="500" y="213" width="80" height="24" rx="6" fill="#4CAF50"/>
<text x="540" y="230" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFF" font-weight="bold">解决方案 ②</text>
<text x="510" y="255" font-family="Arial" font-size="12" fill="#333"><tspan x="510" dy="0">提出 </tspan><tspan font-weight="bold">ProgLoss + STAL + SFGA</tspan><tspan> 组合创新，</tspan><tspan x="510" dy="22">并通过消融实验证明每个模块的必要性，</tspan><tspan x="510" dy="22">补充理论分析和可视化解释</tspan></text>
<rect x="30" y="330" width="390" height="100" rx="8" fill="#FFEBEE" stroke="#E53935" stroke-width="2"/>
<rect x="40" y="338" width="80" height="24" rx="6" fill="#E53935"/>
<text x="80" y="355" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFF" font-weight="bold">审稿意见 ③</text>
<text x="50" y="380" font-family="Arial" font-size="13" fill="#333"><tspan x="50" dy="0" font-weight="bold">缺乏与SOTA方法的系统对比</tspan>，<tspan x="50" dy="22">无法证明相对于已有工作的优势</tspan></text>
<line x1="430" y1="380" x2="480" y2="380" stroke="#607D8B" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="490" y="330" width="400" height="100" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
<rect x="500" y="338" width="80" height="24" rx="6" fill="#4CAF50"/>
<text x="540" y="355" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFF" font-weight="bold">解决方案 ③</text>
<text x="510" y="380" font-family="Arial" font-size="12" fill="#333"><tspan x="510" dy="0">增加 </tspan><tspan font-weight="bold">SOTA对比实验组</tspan><tspan>：</tspan><tspan x="510" dy="22">YOLO11 m → YOLO26 m → YOLO26+改进模块</tspan><tspan x="510" dy="22">→ </tspan><tspan font-weight="bold">LA-YOLO26 m</tspan><tspan>，逐步证明每个改进有效</tspan></text>
<rect x="30" y="455" width="390" height="100" rx="8" fill="#FFEBEE" stroke="#E53935" stroke-width="2"/>
<rect x="40" y="463" width="80" height="24" rx="6" fill="#E53935"/>
<text x="80" y="480" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFF" font-weight="bold">审稿意见 ④</text>
<text x="50" y="505" font-family="Arial" font-size="13" fill="#333"><tspan x="50" dy="0" font-weight="bold">无法验证泛化能力</tspan>，论文强调<tspan x="50" dy="22">复杂视觉干扰但缺少跨场景测试</tspan></text>
<line x1="430" y1="505" x2="480" y2="505" stroke="#607D8B" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="490" y="455" width="400" height="100" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
<rect x="500" y="463" width="80" height="24" rx="6" fill="#4CAF50"/>
<text x="540" y="480" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFF" font-weight="bold">解决方案 ④</text>
<text x="510" y="505" font-family="Arial" font-size="12" fill="#333"><tspan x="510" dy="0">增加 </tspan><tspan font-weight="bold">泛化实验组</tspan><tspan>：</tspan><tspan x="510" dy="22">① </tspan><tspan font-weight="bold">烟雾干扰</tspan><tspan> 场景  ② </tspan><tspan font-weight="bold">CarCrash</tspan><tspan> 交通事故场景</tspan><tspan x="510" dy="22">证明 LA-YOLO26 跨场景鲁棒性</tspan></text>
<rect x="80" y="590" width="760" height="80" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
<rect x="90" y="598" width="140" height="26" rx="6" fill="#1E88E5"/>
<text x="160" y="616" text-anchor="middle" font-family="Arial" font-size="13" fill="#FFF" font-weight="bold">三组实验完整证据链</text>
<rect x="110" y="636" width="180" height="26" rx="6" fill="#C8E6C9" stroke="#4CAF50"/>
<text x="200.0" y="654" text-anchor="middle" font-family="Arial" font-size="11" fill="#333" font-weight="bold">第一组：消融实验 → 内部有效性</text>
<text x="360" y="654" text-anchor="middle" font-family="Arial" font-size="18" fill="#888">+</text>
<rect x="390" y="636" width="180" height="26" rx="6" fill="#BBDEFB" stroke="#1E88E5"/>
<text x="480.0" y="654" text-anchor="middle" font-family="Arial" font-size="11" fill="#333" font-weight="bold">第二组：SOTA对比 → 外部竞争力</text>
<text x="640" y="654" text-anchor="middle" font-family="Arial" font-size="18" fill="#888">+</text>
<rect x="670" y="636" width="200" height="26" rx="6" fill="#FFE0B2" stroke="#FB8C00"/>
<text x="770.0" y="654" text-anchor="middle" font-family="Arial" font-size="11" fill="#333" font-weight="bold">第三组：泛化实验 → 实际部署价值</text>
</svg>